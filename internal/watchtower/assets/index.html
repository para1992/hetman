<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}}</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/control.css">
<script src="/assets/app.js" defer></script>
<script src="/assets/control.js" defer></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="#/">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 22l1.6-11h2.8L15 22M7.5 11h9M8.5 11l-1-4h9l-1 4M12 7V2.5M12 2.5l4 1.6-4 1.6"/></svg>
    <span id="brand">{{.Title}}</span>
  </a>
  <span class="bar-orders" id="orders"></span>
  <span class="live" id="live" data-state="connecting"><span class="live-dot"></span><span class="live-text">{{.Connecting}}</span></span>
  <select class="lang" id="lang"></select>
</header>
<main id="app" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p class="empty">{{.NoScript}}</p></noscript>
</body>
</html>
