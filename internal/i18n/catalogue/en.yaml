op.summary.new: create the orders file with its first node, whose main outcome leads to done
op.summary.add: add a node after a node (on its main outcome, or the outcome via) or before a node; the flow is rewired through it
op.summary.remove: remove a node; whatever led to it then leads where its main outcome led
op.summary.rename: rename a node in the start, every transition and every prompt template placeholder
op.summary.link: make an outcome of a node lead to a node, done or failed; with max and then, at most max times per campaign, after which the outcome then is taken instead
op.summary.unlink: remove the transition of an outcome of a node
op.summary.set: "set a field of a node: {fields}"
op.summary.unset: "remove a field of a node: {fields}"
op.summary.check: declare a check, or change the command, timeout, soft flag or locks of a declared one (soft only warns; required blocks the gate)
op.summary.executor: declare an executor (an adapter program and its arguments), or change its command
op.summary.gate-add: add a declared check to a gate, at a position from 1 (the end when not given)
op.summary.gate-remove: remove a check from a gate
op.summary.show-add: "add a file to what a gate or human node shows the person before answering: relative to the orders folder, or {{work}}/FILE for one in the campaign's work folder"
op.summary.show-remove: remove a file from what a gate or human node shows the person
op.summary.ask: add a question to a gate (yes or no) or a human node (yesno, choice with options, or text)
