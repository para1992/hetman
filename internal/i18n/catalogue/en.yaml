# ---- an operation on the orders file in plain words (wizard, scribe)

op.words.new: create a new flow whose first step is the {type} node {node}{more}
op.words.new_named: create a new flow named {flow} whose first step is the {type} node {node}{more}
op.words.add_before: add the {type} node {node} before {before}{more}
op.words.add_after: add the {type} node {node} after {after}{more}
op.words.add_after_via: add the {type} node {node} after {after} (on its outcome {via}){more}
op.words.remove: remove the node {node} and lead whatever led to it where its main outcome led
op.words.rename: rename the node {node} to {name} everywhere it is referenced
op.words.link: make the outcome {outcome} of {node} lead to {target}
op.words.link_limited: make the outcome {outcome} of {node} lead to {target} at most {n} time(s) per campaign, and then take the outcome {then} instead
op.words.workdir: let agent steps work in {workdir}, relative to the orders folder, unless a node names its own folder
op.words.unlink: remove the transition of {node} on the outcome {outcome}
op.words.set: set {field} of {node} to {value}
op.words.unset: remove {field} from {node}
op.words.running: running {run}
op.words.with_timeout: with the timeout {timeout}
op.words.soft: soft (it only warns)
op.words.required: required (it blocks the gate)
op.words.check: declare or change the check {name}{more}
op.words.executor: declare or change the executor {name}, running {run}
op.words.gate_add: add the check {check} to the gate {node} at the end
op.words.gate_add_at: add the check {check} to the gate {node} at position {at}
op.words.gate_remove: remove the check {check} from the gate {node}
op.words.show_add: show {file} to the person at {node}
op.words.show_remove: stop showing {file} at {node}
op.words.ask: "add the {kind} question {id} to {node}: {question}"
op.words.ask_options: "add the {kind} question {id} to {node}: {question} (options {options})"
op.words.language: write what the flow addresses to a person in {language}, code {code}
