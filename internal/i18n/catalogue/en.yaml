# English messages of Hetman's interface: the source of every translation.
#
# Each key maps to a message, or, for a message that depends on a number,
# to its plural forms by CLDR category. Parameters are written in braces,
# such as {node}; the number that picks a plural form is always {n}.
# Node, check and outcome names, commands and file names are parameters or
# stay literal, in Latin letters.

