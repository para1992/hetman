scribe.usage_models: |

  models and efforts:
    hetman scribe models [-f FILE] [-refresh] [EXECUTOR] [WORDS...]
               what the client of each executor offers; words keep only the models whose name holds them
    -unlisted  (set, new, add, role, role-add) accept a model or effort the catalogue does not list
