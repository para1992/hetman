# Українські повідомлення інтерфейсу Hetman.
#
# Ключі ті самі, що в en.yaml; параметри у фігурних дужках не
# перекладаються. Множинні форми: one (1, 21, 31…), few (2–4, 22–24…),
# many (0, 5–20, 25–30…). Назви кроків, перевірок і підсумків, команди та
# імена файлів лишаються латиницею, як їх пише людина.

