# ---- командний рядок

cli.usage: |
  використання: hetman <команда> [прапорці]

  команди:
    check    перевірити наказ, нічого не запускаючи
    run      почати новий похід і вести його
    status   показати, де зараз похід
    halt     стати на привал після поточного кроку походу
    resume   продовжити похід, що стоїть на привалі, зупинився чи був перерваний
    retry    виконати провалений крок походу знову з новим запасом спроб
    rewind   повернути похід до вузла, на якому він уже був; кроки після нього виконуються знову
    answer   відповісти на запитання, які похід ставить людині
    serve    показувати всі походи наживо на вебсторінці (Вежа)
    task     ставити внутрішні завдання в чергу, перелічувати, показувати й
             скасовувати їх, перевіряти файл маршрутів (усе перелічує hetman task help)
    dispatch починати похід потоку з маршруту для кожного завдання в черзі
             (прапорці перелічує hetman dispatch -h)
    scribe   налаштувати потік: майстер, операції над файлом наказу,
             речення через модель, походи простими словами
             (усе перелічує hetman scribe help)
    version  показати версію hetman

  прапорці (check, run, status, halt, resume, retry, rewind, serve):
    -f FILE  файл наказу (типово orders.yaml)
  прапорці (run):
    -input FILE  JSON-файл із вхідними даними походу: об'єкт, на який можуть посилатися шаблони промптів;
                 якщо наказ має розділ input, файл перевіряється за ним
    -ask         запитати вхідні дані в терміналі формою, зробленою з розділу input наказу;
                 відповіді записуються в .hetman/inputs
    -save-only   з -ask: записати файл вхідних даних, показати його шлях і нічого не починати
  прапорці (status, halt, resume, retry, rewind, answer):
    -c ID    номер походу (типово останній)
  прапорці (retry, rewind):
    -by NAME  хто просить (типово ім'я користувача цього комп'ютера)
  прапорці (rewind):
    -to NODE  вузол, до якого повернутися; похід мусить уже побувати на ньому
  прапорці (answer; без -a, -comment і -outcome питає в терміналі):
    -a ID=ANSWER       відповідь на одне запитання (yes чи no, варіант або текст); повторіть для кожного
    -comment ID=TEXT   коментар до однієї відповіді; повторюйте за потреби
    -outcome NAME      підсумок, вибраний на вузлі human
    -ask N             відповісти, лише якщо запитання #N досі відкрите
    -by NAME           хто відповідає (типово ім'я користувача цього комп'ютера)
  прапорці (status):
    -events  також перелічити всі події літопису
  прапорці (serve):
    -addr ADDRESS  де слухати (типово 127.0.0.1:8740, доступно лише з цього комп'ютера)
  прапорці (scribe skill):
    -dir DIR  тека для файлу навички (типово .agents/skills/hetman-scribe)
    -force    замінити наявний файл навички, якщо він інший

  середовище:
    HETMAN_LANGUAGE=CODE  ваша мова: нею говорить інтерфейс; для походів, які починаються зараз
                          (check, run), вона також замінює ключ language наказу; похід зберігає
                          мову, з якою почався

  коди виходу run, resume, retry і rewind: 0 done, 1 failed, 3 привал, 4 помилка, 5 чекає на людину, 130 перервано
