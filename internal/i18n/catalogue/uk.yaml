# ---- hetman scribe

scribe.usage: |
  використання:
    hetman scribe [-f FILE]                      майстер: створити чи змінити потік, відповідаючи на запитання
    hetman scribe [-f FILE] [-yes] "SENTENCE"    одне речення — одна операція або запитання, через модель, названу в наказі
    hetman scribe OPERATION ARGS [flags]         одна операція над файлом наказу
    hetman scribe explain [-f FILE] [-c ID] [-kind KIND] [-node NODE]
                                                 пояснити похід простими словами (види: {kinds})
    hetman scribe skill [-dir DIR] [-force]      записати навичку помічника налаштування для агента програміста

  операції:
scribe.usage_flags: |

  прапорці вузла (new, add): -run CMD, -timeout D, -checks A,B, -executor NAME, -model M, -effort E,
    -role NAME (агентський вузол, що працює через роль, замість -executor, -model і -effort),
    -tools A,B, -attempts N, -prompt FILE, -schema FILE, -outcomes A,B, -on OUTCOME=TARGET (повторюваний),
    -starters (створити відсутні файли промпту й схеми), -locks A,B (ресурси, які крок тримає сам),
    -segment FILE (segment, foreach), -input REF (segment), -items REF і -parallel N (foreach)
  поля для set: run, timeout, idle_timeout, executor, role, model, effort, tools, attempts, dialogue, prompt, schema,
    locks, segment, input, items, parallel
  поля для unset: timeout, idle_timeout, model, effort, tools, attempts, dialogue, locks, input, parallel
  коди мов: {codes}
  прапорці кожної операції:
    -f FILE    файл наказу (типово orders.yaml)
    -dry-run   показати зміну й перевірку, нічого не записуючи
    -force     записати, навіть якщо результат не проходить перевірку (для стану, який доробите пізніше)
