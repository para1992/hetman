cli.task.usage: |
  використання: hetman task <команда> [прапорці]

  команди:
    add     поставити завдання в чергу: hetman task add -kind KIND [-key KEY] [-input FILE] [-force]
    new     запитати вхідні дані завдання формою, зробленою з розділу input наказу,
            на який веде маршрут, і поставити його в чергу:
            hetman task new -kind KIND [-key KEY] [-force] [-save-only]
    list    перелічити завдання з їхніми станами
    show    показати одне завдання і його похід: hetman task show ID
    cancel  скасувати завдання з черги: hetman task cancel ID
    check   перевірити файл маршрутів і кожен наказ, на який він веде

  прапорці:
    -r FILE      файл маршрутів (типово routes.yaml)
    -kind KIND   вид завдання; файл маршрутів називає потік, що його виконує
    -key KEY     ключ для відсіювання повторів: нічого не додається, поки існує
                 нескасоване завдання з цим ключем, у будь-якому стані
    -force       додати завдання, навіть коли його ключ уже зайнятий
    -input FILE  JSON-файл із вхідними даними завдання, один об'єкт; - читає стандартний
                 вхід; без нього вхідні дані — {}
    -save-only   new: записати файл вхідних даних у .hetman/inputs, показати його шлях і
                 нічого не ставити в чергу
    -state S     показати лише завдання в цьому стані (назва стану англійською: queued,
                 cancelled, running, waiting, done, failed, halted, error)
