cli.dispatch.usage: |
  використання: hetman dispatch [-r FILE] [-once] [-limit N]

  Починає похід потоку з маршруту для кожного завдання в черзі, за пріоритетом,
  а тоді за віком, і працює далі. Спершу продовжує походи, які ніхто не веде і
  які можуть іти без людини, наприклад перервані, коли диспетчер зупинився.

  прапорці:
    -r FILE   файл маршрутів (типово routes.yaml)
    -once     зупинитися, коли в черзі нічого немає і нічого не виконується, а не чекати нових завдань
    -limit N  скільки походів виконується одночасно (типово ліміт файлу маршрутів, інакше 1)
    -poll D   як часто переглядати чергу на нові завдання (типово 1s)
