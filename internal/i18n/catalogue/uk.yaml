# ---- командний рядок

cli.usage: |
  використання: hetman <команда> [прапорці]

  команди:
    check    перевірити наказ, нічого не запускаючи
    run      почати новий похід і вести його
    status   показати, де зараз похід
    halt     стати на привал після поточного кроку походу
    resume   продовжити похід, що стоїть на привалі, зупинився чи був перерваний
    answer   відповісти на запитання, які похід ставить людині
    serve    показувати всі походи наживо на вебсторінці (Вежа)
    scribe   налаштувати потік: майстер, операції над файлом наказу,
             речення через модель, походи простими словами
             (усе перелічує hetman scribe help)
    version  показати версію hetman

  прапорці (check, run, status, halt, resume, serve):
    -f FILE  файл наказу (типово orders.yaml)
  прапорці (run):
    -input FILE  JSON-файл із вхідними даними походу: об'єкт, на який можуть посилатися шаблони промптів
  прапорці (status, halt, resume, answer):
    -c ID    номер походу (типово останній)
  прапорці (answer; без -a, -comment і -outcome питає в терміналі):
    -a ID=ANSWER       відповідь на одне запитання (yes чи no, варіант або текст); повторіть для кожного
    -comment ID=TEXT   коментар до однієї відповіді; повторюйте за потреби
    -outcome NAME      підсумок, вибраний на вузлі human
    -ask N             відповісти, лише якщо запитання #N досі відкрите
    -by NAME           хто відповідає (типово ім'я користувача цього комп'ютера)
  прапорці (status):
    -events  також перелічити всі події літопису
  прапорці (serve):
    -addr ADDRESS  де слухати (типово 127.0.0.1:8740, доступно лише з цього комп'ютера)
  прапорці (scribe skill):
