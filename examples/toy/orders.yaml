# A toy flow: four script steps and a gate between test and publish.
#
#   hetman check -f examples/toy/orders.yaml
#   hetman run   -f examples/toy/orders.yaml
#
# The steps read optional variables to show other paths:
#   TOY_SLEEP=20     the build step takes 20 seconds (time to kill or halt)
#   TOY_LINT_FAIL=1  the soft lint check fails (a warning, the gate still passes)
#   TOY_TESTS_FAIL=1 the required tests check fails (the gate blocks)
version: 0
flow: toy
start: prepare

checks:
  lint:  {run: [./steps/lint.sh], soft: true}
  tests: {run: [./steps/tests.sh], timeout: 1m}

nodes:
  prepare:
    type: script
    run: [./steps/prepare.sh]
    on: {ok: build, fail: failed}
  build:
    type: script
    run: [./steps/build.sh]
    timeout: 5m
    on: {ok: test, fail: failed, timeout: failed}
  test:
    type: script
    run: [./steps/test.sh]
    on: {ok: ready, fail: failed}
  ready:
    type: gate
    checks: [lint, tests]
    on: {pass: publish, blocked: failed}
  publish:
    type: script
    run: [./steps/publish.sh]
    on: {ok: done, fail: failed}
