# Two agent steps run by the OpenCode client, with a gate between them: the
# draft step writes a short note into note.md in this folder with its file
# tools, the gate checks the file, and the review step reads it and may send
# it back to the draft once.
#
# It needs the client installed (opencode on the path) with a provider it can
# use, and the adapter. Build the adapter once, from the repository root:
#
#   go build -o examples/opencode/bin/hetman-adapter-opencode ./cmd/hetman-adapter-opencode
#
# Then, in this folder:
#
#   hetman check
#   hetman run -input input.json
#   hetman status
#
# A run makes two to four small requests. The model below is one of the
# client's free models; any model "opencode models" lists works, written as
# provider/model. The gate's check is a POSIX shell script; on Windows run it
# from a shell that has sh on its path, such as Git Bash.
version: 0
flow: opencode-demo
workdir: .   # the folder agent steps work in, relative to this file
start: draft

executors:
  opencode: {run: [./bin/hetman-adapter-opencode]}

checks:
  note: {run: [sh, checks/note.sh], timeout: 30s}

nodes:
  draft:
    type: agent
    executor: opencode
    prompt: prompts/draft.md
    schema: schemas/draft.json
    model: opencode/big-pickle
    tools: [read, edit]          # client permission names; edit covers writing files
    timeout: 5m
    idle_timeout: 3m
    max_attempts: 2
    on: {ok: ready, fail: failed}
  ready:
    type: gate
    checks: [note]
    on: {pass: review, blocked: failed}
  review:
    type: agent
    executor: opencode
    prompt: prompts/review.md
    schema: schemas/review.json
    model: opencode/big-pickle
    tools: [read]                # the reviewer can read files, not change them
    timeout: 5m
    idle_timeout: 3m
    max_attempts: 2
    on: {approved: done, needs_rework: draft, rejected: failed, fail: failed}
